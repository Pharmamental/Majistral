// ---- renk
const hex2=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const toHex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix=(h,t,a)=>{const x=hex2(h),y=hex2(t);return toHex(x.map((v,i)=>v+(y[i]-v)*a))};
const L=(h,a)=>mix(h,'#ffffff',a), D=(h,a)=>mix(h,'#2a1a10',a);

// ---- şekil (çizim alanı 0..100)
const f=v=>(+v).toFixed(2);
const rr=(x,y,w,h,r)=>`M${x+r},${y}H${x+w-r}A${r},${r} 0 0 1 ${x+w},${y+r}V${y+h-r}A${r},${r} 0 0 1 ${x+w-r},${y+h}H${x+r}A${r},${r} 0 0 1 ${x},${y+h-r}V${y+r}A${r},${r} 0 0 1 ${x+r},${y}Z`;
const circ=(cx,cy,r)=>`M${cx-r},${cy}A${r},${r} 0 1 0 ${cx+r},${cy}A${r},${r} 0 1 0 ${cx-r},${cy}Z`;
// iki ucu yuvarlak çubuk
function cap(x1,y1,x2,y2,w){const r=w/2,dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy),nx=-dy/l*r,ny=dx/l*r;
 return `M${f(x1+nx)},${f(y1+ny)}L${f(x2+nx)},${f(y2+ny)}A${r},${r} 0 0 0 ${f(x2-nx)},${f(y2-ny)}L${f(x1-nx)},${f(y1-ny)}A${r},${r} 0 0 0 ${f(x1+nx)},${f(y1+ny)}Z`}

// ---- çizim (Pharmamental üreticisinden aynen)
const KALINLIK=7, YAN_KOYU=.32, UST_ACIK=.18, KENAR_ACIK=.35;
const P=(p,ex='')=>`<path d="${p.d}" fill-rule="evenodd" ${ex}/>`;
const wrap=(ik,s)=>ik.rot?`<g transform="rotate(${ik.rot} 50 50)">${s}</g>`:s;
let uid=0;
function svgIkon(ik){
 const id='b'+(uid++),defs=[];let n=0;
 const lin=(a,b)=>{const i=id+'_'+(n++);defs.push(`<linearGradient id="${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`);return`url(#${i})`};
 const blur=id+'_z';defs.push(`<filter id="${blur}" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="2"/></filter>`);
 let yan='';
 const boru=(p,c)=>P(p,`fill="none" stroke="${c}" stroke-width="${p.w}" stroke-linecap="round" stroke-linejoin="round"`);
 for(let k=KALINLIK;k>=1;k--)yan+=`<g transform="translate(0 ${k-3})">${wrap(ik,ik.parts.map(p=>p.flat?'':p.w?boru(p,D(p.c,YAN_KOYU)):p.line?'':P(p,`fill="${D(p.c,YAN_KOYU)}" stroke="${D(p.c,YAN_KOYU)}" stroke-width=".8"`)).join(''))}</g>`;
 const ust=ik.parts.map(p=>p.w?boru(p,p.c):p.line
   ?P(p,`fill="none" stroke="${p.c}" stroke-width="3" stroke-linecap="round"`)
   :P(p,`fill="${lin(L(p.c,UST_ACIK),p.c)}" stroke="${L(p.c,KENAR_ACIK)}" stroke-width=".8"`)).join('');
 const zemin=`<ellipse cx="50" cy="92" rx="28" ry="4.5" fill="#3a2418" opacity=".16" filter="url(#${blur})"/>`;
 return`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs>${defs.join('')}</defs>${zemin}${yan}<g transform="translate(0 -3)">${wrap(ik,ust)}</g></svg>`;
}

// ?tek&px=<boy>#<sıra> : yalnız o ikonu şeffaf çizer (export.py kullanır)
if(location.search.includes('tek')){
 const px=+(new URLSearchParams(location.search).get('px')||288);
 document.body.className='tek';
 document.body.innerHTML=`<div class="tek" style="width:${px}px;height:${px}px">${svgIkon(IKONLAR[+location.hash.slice(1)])}</div>`;
}else{
 const gruplar=[...new Set(IKONLAR.map(i=>i.grup))];

 <h2>28 px</h2><div class="kucuk">${IKONLAR.map(ik=>svgIkon(ik)).join('')}</div></main>`;
}

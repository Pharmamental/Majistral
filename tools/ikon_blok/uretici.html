// üreticisinden; 2026-10-29'dan beri renkli bilimsel çizim tarzında boyanır (aşağıda svgIkon).
// Yeni ikon: IKONLAR'a bir kayıt ekle, sayfayı aç, sonra `py -3 export.py` ile PNG al.

// ---- renk
const hex2=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const toHex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix=(h,t,a)=>{const x=hex2(h),y=hex2(t);return toHex(x.map((v,i)=>v+(y[i]-v)*a))};
const L=(h,a)=>mix(h,'#ffffff',a), D=(h,a)=>mix(h,'#2a1a10',a);

// ---- şekil (çizim alanı 0..100)
const f=v=>(+v).toFixed(2);
const rr=(x,y,w,h,r)=>`M${x+r},${y}H${x+w-r}A${r},${r} 0 0 1 ${x+w},${y+r}V${y+h-r}A${r},${r} 0 0 1 ${x+w-r},${y+h}H${x+r}A${r},${r} 0 0 1 ${x},${y+h-r}V${y+r}A${r},${r} 0 0 1 ${x+r},${y}Z`;
const circ=(cx,cy,r)=>`M${cx-r},${cy}A${r},${r} 0 1 0 ${cx+r},${cy}A${r},${r} 0 1 0 ${cx-r},${cy}Z`;
// sivri tepeli altıgen (petek gözü)
const hx=(cx,cy,r)=>'M'+[0,1,2,3,4,5].map(k=>{const a=(k*60-90)*Math.PI/180;return`${f(cx+r*Math.cos(a))},${f(cy+r*Math.sin(a))}`}).join('L')+'Z';
// iki ucu yuvarlak çubuk
function cap(x1,y1,x2,y2,w){const r=w/2,dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy),nx=-dy/l*r,ny=dx/l*r;
 return `M${f(x1+nx)},${f(y1+ny)}L${f(x2+nx)},${f(y2+ny)}A${r},${r} 0 0 0 ${f(x2-nx)},${f(y2-ny)}L${f(x1-nx)},${f(y1-ny)}A${r},${r} 0 0 0 ${f(x1+nx)},${f(y1+ny)}Z`}
// yaprak: (x,y) sapından, açı (derece, 0 = yukarı), boy, en
function leaf(x,y,ang,len,wid){
 const a=(ang-90)*Math.PI/180,ux=Math.cos(a),uy=Math.sin(a),nx=-uy,ny=ux,tx=x+ux*len,ty=y+uy*len,m=len*.5;
 return `M${f(x)},${f(y)}Q${f(x+ux*m+nx*wid)},${f(y+uy*m+ny*wid)} ${f(tx)},${f(ty)}Q${f(x+ux*m-nx*wid)},${f(y+uy*m-ny*wid)} ${f(x)},${f(y)}Z`}
// taç yaprağı: merkezden dışa
const petal=(cx,cy,ang,dist,len,wid)=>{const a=(ang-90)*Math.PI/180;return leaf(cx+Math.cos(a)*dist,cy+Math.sin(a)*dist,ang,len,wid)};
const stem=(pts,w=3,c='#7C8F55')=>({d:'M'+pts.map(p=>p.join(',')).join('L'),c,w});

// ---- çizim: renkli bilimsel çizim (Tuğrul, 2026-10-29, tarz sayfasında "27"; oyuncak blok
// küçük boyda okunmuyordu). Eski farmakope levhası gibi: açık renk boya, mürekkep kontur,
// ışık sol üstten, gövdelerin sağ alt yarısında çapraz tarama. Çizgi kalınlığı tarz sayfasındakinden
// biraz kalın, oyundaki 40 piksellik boyda kaybolmasın diye.
const BOYA=.3, CIZGI=2.2, TARAMA=.7, ARALIK=2.6, MUREKKEP='#172033';
const P=(p,ex='')=>`<path d="${p.d}" fill-rule="evenodd" ${ex}/>`;
const wrap=(ik,s)=>ik.rot?`<g transform="rotate(${ik.rot} 50 50)">${s}</g>`:s;
let uid=0;
function svgIkon(ik){
 const id='b'+(uid++),golge=id+'_g',tarama=id+'_t';
 const defs=`<clipPath id="${golge}"><path d="M100,0V100H0Z"/></clipPath>`
  +`<pattern id="${tarama}" width="${ARALIK}" height="${ARALIK}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="${TARAMA}" height="${ARALIK}" fill="${MUREKKEP}" fill-opacity=".75"/></pattern>`;
 const boru=(p,c,w)=>P(p,`fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`);
 const kontur=(p,w)=>P(p,`fill="none" stroke="${MUREKKEP}" stroke-width="${w}" stroke-linejoin="round"`);
 // glass:1 (fanus camı): taramasız, yarı saydam, en üstte
 const kati=ik.parts.filter(p=>!p.glass), cam=ik.parts.filter(p=>p.glass);
 const govde=kati.map(p=>p.line?P(p,`fill="none" stroke="${MUREKKEP}" stroke-width="3" stroke-linecap="round"`)
   :p.w?boru(p,MUREKKEP,p.w+CIZGI*.8)+boru(p,L(p.c,.2),p.w)
   :P(p,`fill="${L(p.c,BOYA)}"`)+(p.flat?'':`<g clip-path="url(#${golge})">${P(p,`fill="url(#${tarama})"`)}</g>`)+kontur(p,p.flat?CIZGI*.7:CIZGI)).join('')
  +cam.map(p=>p.line?P(p,`fill="none" stroke="${MUREKKEP}" stroke-width="${p.sw||3}" stroke-linecap="round" opacity="${(p.op??1)*.7}"`)
   :P(p,`fill="${L(p.c,BOYA)}" opacity="${p.op??.25}"`)+P(p,`fill="none" stroke="${MUREKKEP}" stroke-width="1.2" opacity=".55"`)).join('');
 return`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${wrap(ik,govde)}</svg>`;
}

// ?tek&px=<boy>#<sıra> : yalnız o ikonu şeffaf çizer (export.py kullanır)
if(location.search.includes('tek')){
 const px=+(new URLSearchParams(location.search).get('px')||288);
 document.body.className='tek';
 document.body.innerHTML=`<div class="tek" style="width:${px}px;height:${px}px">${svgIkon(IKONLAR[+location.hash.slice(1)])}</div>`;
}else{
 const gruplar=[...new Set(IKONLAR.map(i=>i.grup))];
 document.body.innerHTML=`<main><h1>Majistral İkonları</h1>${gruplar.map(g=>`<h2>${g}</h2><div class="izgara">${IKONLAR.filter(i=>i.grup==g).map(ik=>`<div class="kutu" style="background:${ik.kutu}">${svgIkon(ik)}<span>${ik.ad}</span></div>`).join('')}</div>`).join('')}
 <h2>28 px</h2><div class="kucuk">${IKONLAR.map(ik=>svgIkon(ik)).join('')}</div></main>`;
}
